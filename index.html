<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Compressor</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <header>
    <nav class="top-nav">
      <button id="darkModeToggle">🌙 Dark Mode</button>
      <a href="#">User Guide</a>
      <a href="#">FAQ</a>
      <a href="#">File Size Calculator</a>
    </nav>
  </header>

  <main>
    <aside class="stats-panel">
      <h2>Current Session Stats</h2>
      <ul>
        <li><strong>Images Processed:</strong> 0</li>
        <li><strong>MB Data Reduced:</strong> 0</li>
        <li><strong>% Average Compression:</strong> 0%</li>
        <li><strong>Total bandwidth saved:</strong> 0 MB</li>
        <li><strong>Uploads Needed:</strong> Never</li>
      </ul>
    </aside>

    <section class="compressor-section">
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div class="upload-icon">
          <i class="fas fa-cloud-upload-alt fa-3x" style="color: #0078d7;"></i>
        </div>
        <p class="upload-text">Drag & Drop Images Here or Click to Upload<br>(Max 20 images)</p>
        <button class="upload-btn">
          <i class="fas fa-folder-open"></i> Select Images
        </button>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none" />
      </div>
      <h2 class="why-title">Why Choose Our Image Compressor?</h2>
    </section>
  </main>
</body>
</html>
